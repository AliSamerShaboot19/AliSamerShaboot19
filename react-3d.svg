<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<radialGradient id="bg" cx="50%" cy="50%" r="70%"><stop offset="0" stop-color="#10172a"/><stop offset="1" stop-color="#05070d"/></radialGradient>
<radialGradient id="core" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#fff"/><stop offset="0.4" stop-color="#00f0ff"/><stop offset="1" stop-color="#00f0ff" stop-opacity="0"/></radialGradient>
<filter id="g" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<path id="orb" d="M 85,150 a 115,44 0 1,0 230,0 a 115,44 0 1,0 -230,0"/>
</defs>
<rect width="400" height="300" rx="16" fill="url(#bg)" stroke="#00f0ff" stroke-opacity=".35"/>
<g stroke="#00f0ff" stroke-opacity=".07"><path d="M0 60H400M0 120H400M0 180H400M0 240H400M80 0V300M160 0V300M240 0V300M320 0V300"/></g>
<g filter="url(#g)">
<g>
<animateTransform attributeName="transform" type="rotate" from="0 200 150" to="360 200 150" dur="24s" repeatCount="indefinite"/>
<g transform="rotate(0 200 150)"><use href="#orb" fill="none" stroke="#00f0ff" stroke-width="2"/><circle r="6" fill="#00f0ff"><animateMotion dur="3s" repeatCount="indefinite"><mpath href="#orb"/></animateMotion></circle></g>
<g transform="rotate(60 200 150)"><use href="#orb" fill="none" stroke="#7c5cff" stroke-width="2"/><circle r="6" fill="#7c5cff"><animateMotion dur="4s" repeatCount="indefinite"><mpath href="#orb"/></animateMotion></circle></g>
<g transform="rotate(120 200 150)"><use href="#orb" fill="none" stroke="#ff2bd6" stroke-width="2"/><circle r="6" fill="#ff2bd6"><animateMotion dur="5s" repeatCount="indefinite"><mpath href="#orb"/></animateMotion></circle></g>
</g>
<circle cx="200" cy="150" r="26" fill="url(#core)"><animate attributeName="r" values="22;30;22" dur="2.4s" repeatCount="indefinite"/></circle>
<circle cx="200" cy="150" r="8" fill="#fff"/>
</g>
<text x="200" y="282" text-anchor="middle" font-family="monospace" font-size="14" letter-spacing="6" fill="#00f0ff">REACT<animate attributeName="opacity" values="1;.5;1" dur="2s" repeatCount="indefinite"/></text>
</svg>
