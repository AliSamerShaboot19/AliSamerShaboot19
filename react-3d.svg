<svg xmlns="http://w3.org" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Deep glowing gradients for pseudo-3D effect -->
    <linearGradient id="reactGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d8ff" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#00bcff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#007bff" stop-opacity="1" />
    </linearGradient>
    <linearGradient id="reactGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0052a3" stop-opacity="0.3" />
    </linearGradient>
    <radialGradient id="nucleusGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#00d8ff" />
      <stop offset="100%" stop-color="#002b47" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="floorShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00d8ff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Embedded CSS to power the 3D-like physics & animation -->
    <style>
      @keyframes float3D {
        0% { transform: translateY(0px) rotateX(60deg) rotateY(-10deg) rotateZ(0deg); }
        50% { transform: translateY(-15px) rotateX(55deg) rotateY(10deg) rotateZ(180deg); }
        100% { transform: translateY(0px) rotateX(60deg) rotateY(-10deg) rotateZ(360deg); }
      }
      @keyframes pulseNucleus {
        0%, 100% { transform: scale(1); opacity: 0.9; }
        50% { transform: scale(1.15); opacity: 1; filter: drop-shadow(0 0 15px #00d8ff); }
      }
      @keyframes shadowScale {
        0%, 100% { transform: scale(1); opacity: 0.6; }
        50% { transform: scale(0.8); opacity: 0.3; }
      }
      .main-stage {
        transform-style: preserve-3d;
        perspective: 1000px;
      }
      .react-logo {
        transform-origin: 400px 220px;
        animation: float3D 8s ease-in-out infinite;
      }
      .nucleus {
        transform-origin: 400px 220px;
        animation: pulseNucleus 3s ease-in-out infinite;
      }
      .shadow {
        transform-origin: 400px 420px;
        animation: shadowScale 8s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Dark Background Stage (Matches GitHub Dark Mode seamlessly) -->
  <rect width="100%" height="100%" fill="#0d1117" rx="15" />

  <g class="main-stage">
    <!-- 3D Floor Shadow -->
    <ellipse class="shadow" cx="400" cy="420" rx="160" ry="25" fill="url(#floorShadow)" />

    <!-- React 3D Structure Layer Group -->
    <g class="react-logo">
      <!-- Back layer for 3D extrusion thickness -->
      <g stroke="url(#reactGrad2)" stroke-width="8" fill="none" opacity="0.4" transform="translate(0, 8)">
        <ellipse cx="400" cy="220" rx="70" ry="220" transform="rotate(0 400 220)" />
        <ellipse cx="400" cy="220" rx="70" ry="220" transform="rotate(60 400 220)" />
        <ellipse cx="400" cy="220" rx="70" ry="220" transform="rotate(120 400 220)" />
      </g>

      <!-- Front Glowing Orbit Tracks -->
      <g stroke="url(#reactGrad1)" stroke-width="6" fill="none" filter="drop-shadow(0 0 8px rgba(0,216,255,0.5))">
        <!-- Orbit 1 -->
        <ellipse cx="400" cy="220" rx="70" ry="220" transform="rotate(0 400 220)" />
        <!-- Orbit 2 -->
        <ellipse cx="400" cy="220" rx="70" ry="220" transform="rotate(60 400 220)" />
        <!-- Orbit 3 -->
        <ellipse cx="400" cy="220" rx="70" ry="220" transform="rotate(120 400 220)" />
      </g>
      
      <!-- Overlapping accent borders to sharp-up 3D edges -->
      <g stroke="#ffffff" stroke-width="1.5" fill="none" opacity="0.7">
        <ellipse cx="400" cy="220" rx="70" ry="220" transform="rotate(0 400 220)" stroke-dasharray="100 150" />
        <ellipse cx="400" cy="220" rx="70" ry="220" transform="rotate(60 400 220)" stroke-dasharray="100 150" />
        <ellipse cx="400" cy="220" rx="70" ry="220" transform="rotate(120 400 220)" stroke-dasharray="100 150" />
      </g>
    </g>

    <!-- Glowing Core Nucleus (Floating center sphere) -->
    <circle class="nucleus" cx="400" cy="220" r="24" fill="url(#nucleusGrad)" />
  </g>
</svg>
